basePath: /
definitions:
  domain.Notification:
    properties:
      created_at:
        type: string
      id:
        type: string
      location:
        type: string
      message:
        type: string
      read:
        type: boolean
      sensor_id:
        type: string
      title:
        type: string
      type:
        $ref: '#/definitions/domain.NotificationType'
      user_id:
        description: ID do destinatario, ou "*" para broadcast
        type: string
    type: object
  domain.NotificationType:
    enum:
    - motion_detected
    - light_low
    type: string
    x-enum-varnames:
    - TypeMotionDetected
    - TypeLightLow
host: localhost:8085
info:
  contact: {}
  description: Serviço de notificações da plataforma Aurora Home.
  title: Notifications Service API
  version: "1.0"
paths:
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check do serviço
      tags:
      - health
  /notifications:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Notification'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lista notificações do usuário autenticado
      tags:
      - notifications
  /notifications/{id}/read:
    patch:
      parameters:
      - description: ID da notificação
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Marca uma notificação como lida
      tags:
      - notifications
swagger: "2.0"
