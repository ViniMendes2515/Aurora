basePath: /
host: localhost:8083
info:
  contact: {}
  description: Serviço de segurança e alarmes da plataforma Aurora Home.
  title: Security Service API
  version: "1.0"
paths:
  /alarms:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items: {}
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lista os alarmes recentes
      tags:
      - alarms
  /alarms/{id}/silence:
    post:
      parameters:
      - description: ID do alarme
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Silencia um alarme ativo
      tags:
      - alarms
  /alarms/trigger:
    post:
      consumes:
      - application/json
      parameters:
      - description: Dados opcionais do alarme (location, trigger_type, sensor_id)
        in: body
        name: body
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Dispara um alarme
      tags:
      - alarms
swagger: "2.0"
