basePath: /
host: localhost:8081
info:
  contact: {}
  description: Serviço de sensores da plataforma Aurora Home.
  title: Sensors Service API
  version: "1.0"
paths:
  /sensors:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items: {}
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lista sensores do usuário autenticado
      tags:
      - sensors
  /sensors/{id}/light:
    get:
      parameters:
      - description: ID do sensor
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items: {}
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Histórico de eventos de luminosidade de um sensor
      tags:
      - sensors
  /sensors/{id}/motion:
    get:
      parameters:
      - description: ID do sensor
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items: {}
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Histórico de eventos de movimento de um sensor
      tags:
      - sensors
    post:
      parameters:
      - description: ID do sensor
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Registra evento de movimento via usuário autenticado
      tags:
      - sensors
  /sensors/device/{id}/light:
    post:
      consumes:
      - application/json
      parameters:
      - description: Chave de autenticação do dispositivo
        in: header
        name: X-Device-Key
        required: true
        type: string
      - description: ID do sensor
        in: path
        name: id
        required: true
        type: string
      - description: Valor de luminosidade
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Registra evento de luminosidade via dispositivo (ESP32)
      tags:
      - device
  /sensors/device/{id}/motion:
    post:
      parameters:
      - description: Chave de autenticação do dispositivo
        in: header
        name: X-Device-Key
        required: true
        type: string
      - description: ID do sensor
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Registra evento de movimento via dispositivo (ESP32)
      tags:
      - device
swagger: "2.0"
