<aside class="sidebar fixed left-0 top-0 h-screen bg-gradient-to-b from-aurora-dark via-aurora-light to-aurora-base border-r border-aurora-border flex flex-col z-50 transition-[transform,width] duration-300 overflow-hidden"
       [ngClass]="isCollapsed ? 'w-20' : 'w-64'"
       [class.sidebar-hidden]="!isOpen">

  <div class="h-[4.5rem] flex items-center justify-center border-b border-aurora-border/80 px-4 relative">
    <div class="flex items-end overflow-hidden"
         [class.justify-center]="isCollapsed">
      <div class="flex-shrink-0 flex items-center justify-center w-14">
        <img src="assets/logo-aurora.png" alt="logo AURORA"
             class="w-full h-full object-contain brightness-[10] saturate-0 transition-[filter] duration-300 hover:[filter:brightness(0)_saturate(100%)_invert(60%)_sepia(100%)_saturate(300%)_hue-rotate(145deg)]">
      </div>
      <span *ngIf="!isCollapsed"
            class="font-display text-aurora-text text-[1.25rem] tracking-[0.1em] whitespace-nowrap transition-opacity duration-200">
        Aurora
      </span>
    </div>
  </div>

  <nav class="flex-1 py-6 overflow-y-auto">
    <ul class="list-none p-0 m-0">
      <li *ngFor="let item of menuItems"
          class="mb-1"
          [class.px-3]="!isCollapsed"
          [class.px-2]="isCollapsed">
        <a [routerLink]="item.route"
           routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
           class="menu-link flex items-center gap-3.5 py-2.5 rounded-lg text-aurora-text-muted no-underline font-sans text-[0.75rem] font-semibold tracking-[0.1em] uppercase transition-all duration-200 relative hover:text-aurora-text hover:bg-aurora-primary/[0.08]"
           [ngClass]="isCollapsed ? 'px-0 justify-center' : 'px-3.5'"
           (click)="onMenuClick()">
          <i class="pi {{ item.icon }} text-base w-5 text-center flex-shrink-0"></i>
          <span *ngIf="!isCollapsed" class="whitespace-nowrap overflow-hidden">{{ item.label }}</span>
        </a>
      </li>
    </ul>
  </nav>

  <div class="border-t border-aurora-border/80"
       [class.p-3]="!isCollapsed"
       [class.px-2]="isCollapsed"
       [class.py-3]="isCollapsed">
    <button
      class="w-full flex items-center gap-3.5 py-2.5 rounded-lg text-aurora-text-muted bg-transparent border-none cursor-pointer font-sans text-[0.75rem] font-semibold tracking-[0.1em] uppercase transition-all duration-200 hover:text-red-400 hover:bg-red-500/[0.08]"
      [ngClass]="isCollapsed ? 'px-0 justify-center' : 'px-3.5'"
      (click)="onLogout()">
      <i class="pi pi-sign-out text-base w-5 text-center flex-shrink-0"></i>
      <span *ngIf="!isCollapsed" class="whitespace-nowrap overflow-hidden">Sair</span>
    </button>
  </div>
</aside>
