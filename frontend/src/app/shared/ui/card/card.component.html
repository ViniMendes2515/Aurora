<div class="metric-card relative flex items-center gap-4 rounded-xl px-6 py-5 border transition-all duration-[250ms] overflow-hidden hover:-translate-y-0.5 hover:border-aurora-primary/25"
     [ngClass]="{
       'card-primary bg-aurora-surface/80 border-aurora-primary/20':  variant === 'primary',
       'card-secondary bg-aurora-surface/80 border-aurora-secondary/35': variant === 'secondary',
       'card-base bg-aurora-surface/80 border-aurora-text/[0.12]':    variant === 'base',
       'card-dark bg-aurora-surface/80 border-aurora-dark/50':        variant === 'dark'
     }">
  <div class="w-12 h-12 rounded-[10px] flex items-center justify-center flex-shrink-0"
       [ngClass]="{
         'bg-aurora-primary/[0.15] border border-aurora-primary/20':    variant === 'primary',
         'bg-aurora-secondary/20 border border-aurora-secondary/30':    variant === 'secondary',
         'bg-aurora-text/[0.08] border border-aurora-text/[0.12]':      variant === 'base',
         'bg-aurora-dark/40 border border-aurora-dark/60':              variant === 'dark'
       }">
    <i class="pi {{ icon }} text-[1.25rem]"
       [ngClass]="{
         'text-aurora-primary':      variant === 'primary',
         'text-[#12a5a5]':           variant === 'secondary',
         'text-aurora-text':         variant === 'base',
         'text-aurora-text-muted':   variant === 'dark'
       }"></i>
  </div>
  <div class="flex flex-col gap-0.5">
    <span class="font-display text-[2rem] leading-none"
          [ngClass]="{
            'text-aurora-primary':      variant === 'primary',
            'text-[#12a5a5]':           variant === 'secondary',
            'text-aurora-text':         variant === 'base',
            'text-aurora-text-muted':   variant === 'dark'
          }">{{ value }}</span>
    <span class="font-sans text-[0.6875rem] font-semibold tracking-[0.1em] uppercase text-aurora-text-muted">{{ title }}</span>
  </div>
</div>
