<div class="register-container">
  <div class="register-wrapper">
    <p-card styleClass="register-card">
      <div class="register-header">
        <div class="logo">
          <i class="pi pi-sun"></i>
        </div>
        <h1 class="title">Aurora Home System</h1>
        <p class="subtitle">Crie sua conta</p>
      </div>

      <p-messages [value]="messages" [closable]="true"></p-messages>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-form">
        <div class="form-group">
          <label for="email">E-mail</label>
          <input 
            pInputText 
            id="email" 
            formControlName="email" 
            placeholder="seu@email.com"
            class="w-full"
            [ngClass]="{'ng-invalid ng-dirty': email?.invalid && email?.touched}" />
          <small *ngIf="email?.invalid && email?.touched" class="error-text">
            E-mail inválido
          </small>
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <p-password 
            id="password" 
            formControlName="password" 
            placeholder="Sua senha"
            [toggleMask]="true"
            [feedback]="true"
            styleClass="w-full"
            inputStyleClass="w-full">
          </p-password>
          <small *ngIf="password?.invalid && password?.touched" class="error-text">
            Senha deve ter no mínimo 6 caracteres
          </small>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirmar Senha</label>
          <p-password 
            id="confirmPassword" 
            formControlName="confirmPassword" 
            placeholder="Confirme sua senha"
            [toggleMask]="true"
            [feedback]="false"
            styleClass="w-full"
            inputStyleClass="w-full">
          </p-password>
          <small *ngIf="confirmPassword?.errors?.['passwordMismatch'] && confirmPassword?.touched" class="error-text">
            As senhas não coincidem
          </small>
        </div>

        <button 
          pButton 
          type="submit" 
          label="Criar Conta" 
          [loading]="loading"
          class="submit-btn w-full">
        </button>
      </form>

      <div class="register-footer">
        <p>Já tem uma conta? 
          <a routerLink="/login" class="link">Fazer login</a>
        </p>
      </div>
    </p-card>
  </div>
</div>
