events {
    worker_connections 1024;
}

http {
    upstream auth_service          { server auth-service:8080; }
    upstream sensors_service       { server sensors-service:8081; }
    upstream lighting_service      { server lighting-service:8082; }
    upstream security_service      { server security-service:8083; }
    upstream rules_service         { server rules-service:8084; }
    upstream notifications_service { server notifications-service:8085; }
    upstream frontend              { server frontend:80; }

    # ------------------------------------------------------------------
    # Mapa para tratar corretamente o header Connection em upgrades WS.
    # Quando o cliente envia Connection: Upgrade, repassamos "upgrade".
    # Caso contrário, enviamos "" para não propagar keep-alive do cliente.
    # ------------------------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 10m;

        location /health {
            default_type application/json;
            return 200 '{"status":"ok","service":"api-gateway"}';
        }

        # ==============================================================
        # WEBSOCKET
        # ==============================================================

        # WebSocket: sensors-service (/api/sensors/ws → /ws)
        location /api/sensors/ws {
            proxy_pass         http://sensors_service/ws;
            proxy_http_version 1.1;

            # Headers obrigatórios para upgrade de protocolo
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;

            # Timeout longo: conexões WS ficam abertas indefinidamente
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # WebSocket: lighting-service (/api/lighting/ws → /ws)
        location /api/lighting/ws {
            proxy_pass         http://lighting_service/ws;
            proxy_http_version 1.1;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ==============================================================
        # ROTAS REST
        # ==============================================================

        # auth-service: /api/auth/login → /auth/login
        location /api/auth/ {
            proxy_pass         http://auth_service/auth/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Authorization     $http_authorization;
        }

        # sensors-service: /api/sensors/... → /...
        location /api/sensors/ {
            proxy_pass         http://sensors_service/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Authorization     $http_authorization;
            proxy_set_header   X-Device-Key      $http_x_device_key;
        }

        # lighting-service: /api/lighting/... → /...
        location /api/lighting/ {
            proxy_pass         http://lighting_service/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Authorization     $http_authorization;
            proxy_set_header   X-Device-Key      $http_x_device_key;
        }

        # security-service: /api/security/... → /...
        location /api/security/ {
            proxy_pass         http://security_service/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Authorization     $http_authorization;
            proxy_set_header   X-Device-Key      $http_x_device_key;
        }

        # rules-service: /api/rules/... → /...
        location /api/rules/ {
            proxy_pass         http://rules_service/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Authorization     $http_authorization;
        }

        # notifications-service: /api/notifications/... → /...
        location /api/notifications/ {
            proxy_pass         http://notifications_service/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Authorization     $http_authorization;
        }

        #SPA
        location / {
            proxy_pass         http://frontend/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
    }
}
